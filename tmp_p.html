<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook Embed Provider</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Facebook Embed Provider (Pure JS)</h1>
  <form id="embed-form">
    <input type="url" id="fb-url" placeholder="Paste Facebook URL here" required style="width:60%">
    <button type="submit">Get Embed</button>
  </form>
  <div id="embed-result"></div>
  <script src="index.js" type="module"></script>
</body>
</html>
